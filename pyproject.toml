[project]
name = "babel-bench"
version = "0.1.0"
description = "A coding/reasoning benchmark over procedurally generated programming languages."
requires-python = ">=3.12"
dependencies = ["anthropic>=0.40"]

[project.scripts]
babel-bench = "babel_bench.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/babel_bench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
